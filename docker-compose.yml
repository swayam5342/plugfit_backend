services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plugfit
      POSTGRES_PASSWORD: plugfit
      POSTGRES_DB: plugfit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://plugfit:plugfit@postgres/plugfit
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8067:8067"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://plugfit:plugfit@postgres/plugfit
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "plugfit.app.job.celery", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
